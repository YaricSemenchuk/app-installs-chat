# Установщики десктоп-приложения: .dmg на macOS и .exe на Windows (без подписи).
# Адрес чата задаётся переменной репозитория TEAMCHAT_URL (Settings → Variables), например https://chat.example.com.
# Запуск: вручную (Actions → desktop → Run workflow) или тегом desktop-v1.0.1.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          TEAMCHAT_URL: ${{ vars.TEAMCHAT_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
